{% extends "base_auth.html" %}
{% block title %}Password Reset Complete — CheckDNC{% endblock %}

{% block content %}
<div class="text-center">
  <i class="bi bi-check-circle" style="font-size:2.5rem;color:#3fb950;"></i>
  <h5 class="mt-3 mb-2 fw-semibold" style="color:#e6edf3;">Password reset complete</h5>
  <p style="color:#8b949e;font-size:0.85rem;">
    Your password has been changed. You can now sign in with your new password.
  </p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 fw-semibold mt-2">Sign in</a>
</div>
{% endblock %}
